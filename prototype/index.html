<title>Metanite HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left rail + scrolling work area. Dark-first, single theme (brand). */
:root{
  --green:#13e52c; --green-dim:rgba(19,229,44,.12); --green-line:rgba(19,229,44,.35);
  --bg:#0f0f22; --bg2:#15152c; --bg3:#1d1d38; --bg4:#25254a; --line:#2a2a48;
  --white:#f6f5f1; --text:#d9d8d3; --muted:#8f8fa6;
  --amber:#f5b73b; --red:#ff5c5c; --blue:#5aa9ff;
  --display:"Bricolage Grotesque",Manrope,system-ui,sans-serif;
  --body:Manrope,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);color:var(--white);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:750;line-height:1.1}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--white);background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%}
input:focus,textarea:focus,select:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
textarea{min-height:88px;resize:vertical;line-height:1.5}
::selection{background:var(--green);color:var(--bg)}
.tab{font-variant-numeric:tabular-nums}
kbd{font:11px var(--body);border:1px solid var(--line);background:var(--bg3);border-radius:3px;padding:1px 5px;color:var(--muted)}

/* App frame */
.app{display:flex;min-height:100%}
.rail{width:220px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail .brand{height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line)}
.rail nav{padding:8px;display:flex;flex-direction:column;gap:2px}
.rail nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:3px;text-decoration:none;color:var(--text)}
.rail nav a:hover{background:var(--bg3);color:var(--white)}
.rail nav a.active{background:var(--green-dim);color:var(--green)}
.rail nav a .ic{width:16px;height:16px;flex:none}
.rail .foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.work{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.search{display:flex;align-items:center;gap:8px;height:36px;width:min(320px,100%);padding:0 10px;border:1px solid var(--line);background:var(--bg2);border-radius:3px;color:var(--muted);text-align:left}
.search:hover{border-color:var(--muted)}
.search span{flex:1}
.user{display:flex;align-items:center;gap:10px}
.main{flex:1;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;width:100%}
@media (min-width:900px){.main{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-bottom:40px}}
.mobilenav{display:none}
@media (max-width:899px){
  .rail{display:none}
  .mobilenav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .mobilenav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;color:var(--muted);text-decoration:none}
  .mobilenav a.active{color:var(--green)}
  .mobilenav .ic{width:18px;height:18px}
}

/* Banner */
.proto{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--green);padding:10px 14px;margin-bottom:20px;font-size:13px}
.proto strong{color:var(--white)}
.proto .muted{color:var(--muted)}

/* Primitives */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:3px;font-weight:600;font-size:13px;white-space:nowrap;border:1px solid transparent;transition:filter .12s,background .12s}
.btn.primary{background:var(--green);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.secondary{background:var(--bg3);color:var(--white);border-color:var(--line)}
.btn.secondary:hover{border-color:var(--muted)}
.btn.ghost{color:var(--text)}
.btn.ghost:hover{background:var(--bg3);color:var(--white)}
.btn.danger{background:rgba(255,92,92,.12);color:var(--red);border-color:rgba(255,92,92,.4)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:3px;border:1px solid var(--line);background:var(--bg3);font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap;color:var(--text)}
.badge.green{background:var(--green-dim);color:var(--green);border-color:var(--green-line)}
.badge.amber{background:rgba(245,183,59,.12);color:var(--amber);border-color:rgba(245,183,59,.35)}
.badge.red{background:rgba(255,92,92,.12);color:var(--red);border-color:rgba(255,92,92,.35)}
.badge.blue{background:rgba(90,169,255,.12);color:var(--blue);border-color:rgba(90,169,255,.35)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:3px;min-width:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card .bd{padding:16px 18px}
.card .bd.flush{padding:0}
.label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sb{justify-content:space-between}
.page-hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.page-hd .desc{color:var(--muted);margin-top:4px}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:3px;padding:16px 18px;min-width:0}
.tile .v{font-family:var(--display);font-size:30px;font-weight:750;color:var(--white);margin-top:6px;line-height:1}
.tile .v.green{color:var(--green)} .tile .v.amber{color:var(--amber)} .tile .v.red{color:var(--red)}
.tile .h{font-size:12px;color:var(--muted);margin-top:8px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg3);padding:10px 14px;font-weight:700}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(29,29,56,.6)}
.right{text-align:right}
.muted{color:var(--muted)}
.white{color:var(--white)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.empty{border:1px dashed var(--line);border-radius:3px;padding:40px 20px;text-align:center;color:var(--muted)}
.bar{height:6px;background:var(--bg3);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.bar.amber i{background:var(--amber)} .bar.red i{background:var(--red)}
.saved{font-size:12px;color:var(--muted)}
.saved.on{color:var(--green)}
.back{color:var(--muted);text-decoration:none;font-size:13px;display:inline-flex;gap:6px;align-items:center;margin-bottom:12px}
.back:hover{color:var(--white)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bg3);border:1px solid var(--green-line);color:var(--white);padding:10px 16px;border-radius:3px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
@media (max-width:899px){.toast{bottom:calc(72px + env(safe-area-inset-bottom,0px))}}

/* Pipeline board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:3px;min-height:220px}
.col .ch{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--white)}
.col .ch .n{color:var(--muted);font-weight:600}
.col .cb{padding:8px;display:flex;flex-direction:column;gap:8px}
.lead{background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.lead:hover{border-color:var(--muted)}
.lead .nm{color:var(--white);font-weight:600}
.lead .sub{font-size:12px;color:var(--muted);margin-top:2px}
.lead .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)}
.fit{font-weight:700}
.fit.hi{color:var(--green)} .fit.mid{color:var(--amber)} .fit.lo{color:var(--red)}

/* Drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(15,15,34,.7);z-index:40;display:none}
.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg2);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 20px 20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--white)}

/* Stepper */
.stepper{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.step{text-decoration:none;display:flex;flex-direction:column;gap:6px;padding:10px 14px 12px;min-width:120px;border-bottom:2px solid transparent;text-align:left;color:var(--muted);white-space:nowrap}
.step:hover{color:var(--white)}
.step.active{color:var(--white);border-bottom-color:var(--green)}
.step .t{font-weight:600;font-size:13px}
.step .pct{font-size:11px;display:flex;align-items:center;gap:6px}
.step .pct .bar{width:48px;height:4px}
.step.done .t::after{content:" ✓";color:var(--green)}

/* Audit */
.audit{display:grid;grid-template-columns:220px 1fr 260px;gap:16px}
@media (max-width:1100px){.audit{grid-template-columns:200px 1fr} .audit .ev{grid-column:1/-1}}
@media (max-width:760px){.audit{grid-template-columns:1fr}}
.dimlist{display:flex;flex-direction:column;gap:2px}
.dim{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:3px;text-align:left;color:var(--text)}
.dim:hover{background:var(--bg3)}
.dim.active{background:var(--green-dim);color:var(--green)}
.dim .s{font-weight:700;font-size:12px}
.crit{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.crit:first-child{border-top:0}
.crit .q{color:var(--white);font-weight:600}
.crit .d{font-size:12px;color:var(--muted);margin-top:2px}
@media (max-width:600px){.crit{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{width:36px;height:32px;border-right:1px solid var(--line);color:var(--muted);font-weight:700;font-size:12px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--bg3);color:var(--white)}
.seg button.on{background:var(--green);color:var(--bg)}
.score-big{font-family:var(--display);font-size:44px;font-weight:750;line-height:1;color:var(--white)}
.score-big.green{color:var(--green)} .score-big.amber{color:var(--amber)} .score-big.red{color:var(--red)}
.evitem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.evitem:first-child{border-top:0}
.evitem .k{flex:none;width:52px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.evitem .t{color:var(--white)}
.evitem .m{font-size:12px;color:var(--muted)}

/* Scorecard */
.scorebars{display:flex;flex-direction:column;gap:12px}
.sbar{display:grid;grid-template-columns:1fr 48px;gap:10px;align-items:center}
.sbar .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.sbar .l b{color:var(--white);font-weight:600}
.sbar .n{font-family:var(--display);font-size:18px;font-weight:700;text-align:right;color:var(--white)}
.radar{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}

/* Matrix */
.matrix{position:relative;aspect-ratio:1;max-width:520px;border:1px solid var(--line);background:
  linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat,
  linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat, var(--bg3);border-radius:3px}
.matrix .q{position:absolute;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px}
.matrix .dot{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--bg4);border:2px solid var(--muted);color:var(--white);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.matrix .dot.sel{background:var(--green);border-color:var(--green);color:var(--bg)}
.matrix .dot:hover{transform:scale(1.1)}
.opp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.opp:first-child{border-top:0}
.opp .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.opp.sel .n{background:var(--green);border-color:var(--green);color:var(--bg)}
.opp .t{color:var(--white);font-weight:600}
.opp .d{font-size:12px;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;padding:0;accent-color:var(--green)}

/* Strategy / roadmap */
.rec{padding:14px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:32px 1fr auto;gap:12px}
.rec:first-child{border-top:0}
.rec .num{font-family:var(--display);font-size:18px;font-weight:700;color:var(--muted)}
.rec h3{margin-bottom:4px}
.rec .why{font-size:12px;color:var(--muted);margin-top:6px}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.month{background:var(--bg2);border:1px solid var(--line);border-radius:3px}
.month .mh{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;color:var(--white);font-size:13px;display:flex;justify-content:space-between}
.month .mb{padding:8px;display:flex;flex-direction:column;gap:8px}
.ritem{background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.ritem .t{color:var(--white);font-weight:600;font-size:13px}
.ritem .m{font-size:12px;color:var(--muted);margin-top:3px}
.ritem .f{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.ritem.done{opacity:.6} .ritem.done .t{text-decoration:line-through}
.st{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.st button{padding:3px 8px;font-size:11px;color:var(--muted);border-right:1px solid var(--line)}
.st button:last-child{border-right:0}
.st button.on{background:var(--green-dim);color:var(--green)}

/* Report */
.paper{background:#fbfaf7;color:#1a1a2e;border-radius:3px;padding:40px 36px;max-width:760px;margin:0 auto;font-size:14px}
.paper h1,.paper h2,.paper h3{color:#0f0f22}
.paper .cover{border-bottom:3px solid #13e52c;padding-bottom:28px;margin-bottom:28px}
.paper .cover .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5c5c78;margin-bottom:10px}
.paper .cover h1{font-size:34px}
.paper .cover .meta{color:#5c5c78;margin-top:10px}
.paper section{margin-top:26px;padding-top:18px;border-top:1px solid #e3e1d8}
.paper section h2{font-size:17px;margin-bottom:8px}
.paper p{margin:6px 0;line-height:1.6}
.paper ul,.paper ol{margin:6px 0 6px 20px;padding:0}
.paper li{margin:3px 0}
.paper .sc{display:grid;grid-template-columns:1fr 60px 90px;gap:8px 12px;font-size:13px}
.paper .sc div{padding:6px 0;border-bottom:1px solid #ece9df}
.paper .pill{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11px;font-weight:700}
.paper .pill.strong{background:#dff8e3;color:#157a26}
.paper .pill.dev{background:#fdf0d5;color:#8a5a00}
.paper .pill.crit{background:#ffe1e1;color:#a11919}
.paper .foot{margin-top:28px;font-size:11px;color:#777;border-top:1px solid #e3e1d8;padding-top:10px}
.pgbrk{text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0}
.versions .v{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.versions .v:first-child{border-top:0}

/* Discovery */
.dsec{display:grid;grid-template-columns:200px 1fr;gap:16px}
@media (max-width:760px){.dsec{grid-template-columns:1fr}}
.dnav{display:flex;flex-direction:column;gap:2px}
.dnav button{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:3px;text-align:left;color:var(--text)}
.dnav button:hover{background:var(--bg3)}
.dnav button.active{background:var(--green-dim);color:var(--green)}
.dnav .p{font-size:11px;color:var(--muted)}
.field{margin-bottom:16px}

/* Palette */
.pal-bg{position:fixed;inset:0;background:rgba(15,15,34,.8);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:14vh 16px 0}
.pal-bg.open{display:flex}
.pal{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--line);border-radius:3px}
.pal input{border:0;border-bottom:1px solid var(--line);border-radius:0;height:48px;background:transparent;padding:0 14px}
.pal input:focus{outline:none;border-color:var(--line)}
.pal ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow-y:auto}
.pal li button{display:flex;justify-content:space-between;width:100%;padding:8px 10px;border-radius:3px;text-align:left}
.pal li button.on,.pal li button:hover{background:var(--green-dim);color:var(--green)}
.pal li button span:last-child{font-size:11px;color:var(--muted)}

/* Chapters nav on client page */
.engrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.engrow:first-child{border-top:0}
.minisc{display:flex;gap:3px}
.minisc i{display:block;width:10px;height:22px;border-radius:2px;background:var(--bg4)}
.minisc i.g{background:var(--green)} .minisc i.a{background:var(--amber)} .minisc i.r{background:var(--red)}
.act{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.act:first-child{border-top:0}
.act time{color:var(--muted);flex:none;width:58px;font-size:12px;padding-top:2px}

/* ---------- Scoring ---------- */
function dimScore(r){ if(!r||!r.length) return null; const s=r.reduce((a,b)=>a+b,0); return Math.round(s/(r.length*4)*100); }
function band(s){ return s==null?"":s<40?"red":s<70?"amber":"green"; }
function bandLabel(s){ return s==null?"Not scored":s<40?"Critical":s<70?"Developing":"Strong"; }
function overall(e){ const v=DIMS.map(d=>dimScore(e.ratings[d.key])).filter(x=>x!=null); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null; }
function discPct(e){ const secs=Object.values(e.discovery); let tot=0,done=0; secs.forEach(s=>{Object.values(s.a).forEach(v=>{tot++; if(v&&v.trim()) done++;});}); return Math.round(done/tot*100); }
function auditPct(e){ let n=0,t=0; DIMS.forEach(d=>{ const r=e.ratings[d.key]||[]; t+=d.criteria.length; n+=r.filter(x=>x!=null).length; }); return Math.round(n/t*100); }
function stepPcts(e){ return {
  discovery:discPct(e), evidence:Math.min(100,e.evidence.length*15), audit:auditPct(e), scorecard:auditPct(e)>=100?100:0,
  opportunities:e.opps.some(o=>o.sel)?100:0, strategy:e.recs.length?100:0,
  roadmap:e.roadmap.length?Math.round(e.roadmap.filter(r=>r.st==="Done").length/e.roadmap.length*100):0, report:e.reports.length?100:0 }; }

  <div class="row" style="margin-bottom:18px">${i>0?`<button class="btn secondary sm" onclick="moveLead('${l.id}',-1)">← ${STAGES[i-1]}</button>`:""}${i<STAGES.length-2?`<button class="btn primary sm" onclick="moveLead('${l.id}',1)">${STAGES[i+1]} →</button>`:""}${l.stage!=="Lost"&&l.stage!=="Won"?`<button class="btn danger sm" onclick="setStage('${l.id}','Lost')">Mark lost</button>`:""}</div>
  <span class="label">Next actions</span>
  <div class="stack" style="gap:8px"><button class="btn secondary" onclick="toast('Audit checklist opens for ${esc(l.web)}')">Run free channel audit checklist</button><button class="btn secondary" onclick="toast('Email draft opens in your mail app')">Draft reply</button><button class="btn secondary" onclick="convertLead('${l.id}')">Convert to client</button></div>
  <div style="margin-top:18px"><span class="label">Notes</span><textarea id="leadnote" placeholder="Call notes, context, next step…" oninput="persist()">${esc(l.notes||"")}</textarea></div>`;
  $("#drawerbg").classList.add("open"); $("#drawer").classList.add("open"); }
function closeDrawer(){ $("#drawerbg").classList.remove("open"); $("#drawer").classList.remove("open"); }
function moveLead(id,d){ const l=S.leads.find(x=>x.id===id); const i=STAGES.indexOf(l.stage)+d; l.stage=STAGES[Math.max(0,Math.min(STAGES.length-2,i))]; persist(); render(); openLead(id); toast(`Moved to ${l.stage}`); }
function setStage(id,s){ const l=S.leads.find(x=>x.id===id); l.stage=s; persist(); render(); openLead(id); }
function convertLead(id){ const l=S.leads.find(x=>x.id===id); if(S.clients.some(c=>c.name===l.biz)){toast("Already a client");return;} const cid="c"+(S.clients.length+1); S.clients.push({id:cid,name:l.biz,seg:"Other",loc:"",web:l.web,status:"Prospect",contacts:[{n:l.name,r:"Contact",e:""}],engs:[]}); l.stage="Won"; persist(); closeDrawer(); location.hash="#client-"+cid; toast("Client created"); }
$("#drawerbg").addEventListener("click",closeDrawer);

function vClients(){

  <div class="card"><div class="bd flush tbl-wrap"><table><thead><tr><th>Client</th><th>Segment</th><th>Status</th><th>Engagement</th><th>Scorecard</th><th class="right">Last activity</th></tr></thead><tbody>
  ${S.clients.map(c=>{const e=c.engs[0]?S.engs[c.engs[0]]:null;return `<tr class="click" onclick="location.hash='#client-${c.id}'"><td><b class="white">${esc(c.name)}</b><div class="muted" style="font-size:12px">${esc(c.loc)}</div></td><td>${esc(c.seg)}</td><td><span class="badge ${c.status==="Active"?"green":""}">${c.status}</span></td><td>${e?`${e.type} · ${e.status}`:`<span class="muted">None yet</span>`}</td><td>${e?miniScore(e):"—"}</td><td class="right muted">${e?"1d ago":"3d ago"}</td></tr>`;}).join("")}
  </tbody></table></div></div>`;
}
function miniScore(e){ return `<span class="minisc">${DIMS.map(d=>{const s=dimScore(e.ratings[d.key]);return `<i class="${s==null?"":band(s)==="green"?"g":band(s)==="amber"?"a":"r"}" title="${d.label}: ${s??"—"}"></i>`;}).join("")}</span>`; }

function vClient(){
  const c=S.clients.find(x=>x.id===route.id); if(!c) return vClients();
  return proto()+`<a class="back" href="#clients">← Clients</a>
  <div class="page-hd"><div><h1>${esc(c.name)}</h1><p class="desc">${esc(c.seg)}${c.loc?" · "+esc(c.loc):""} · ${esc(c.web)}</p></div><div class="row"><span class="badge ${c.status==="Active"?"green":""}">${c.status}</span><button class="btn primary" onclick="toast('Engagement setup: Playbook or Partnership')">New engagement</button></div></div>
  <div class="grid g2">
    <div class="card"><div class="hd"><h2>Engagements</h2></div><div class="bd">
      ${c.engs.length?c.engs.map(id=>{const e=S.engs[id];return `<div class="engrow"><div><a href="#eng-${e.id}" class="white" style="font-weight:600;text-decoration:none">${e.type} · started ${e.start}</a><div class="muted" style="font-size:12px">Stage: ${e.status} · ${e.fee} · overall ${overall(e)??"—"}</div><div style="margin-top:6px">${miniScore(e)}</div></div><a class="btn secondary sm" href="#eng-${e.id}">Open</a></div>`;}).join(""):`<div class="empty">No engagement yet. Start a Playbook once the application is accepted.</div>`}
    </div></div>
    <div class="card"><div class="hd"><h2>Contacts</h2><button class="btn ghost sm" onclick="toast('Contact form opens')">Add</button></div><div class="bd">
      ${c.contacts.map(p=>`<div class="att"><div><div class="t">${esc(p.n)}</div><div class="m">${esc(p.r)}${p.e?" · "+esc(p.e):""}</div></div></div>`).join("")}
    </div></div>
  </div>`;
}

const STEPS=[["overview","Overview"],["discovery","Discovery"],["evidence","Evidence"],["audit","Audit"],["scorecard","Scorecard"],["opportunities","Opportunities"],["strategy","Strategy"],["roadmap","Roadmap"],["report","Report"]];
function vEng(){
  const e=S.engs[route.id]; if(!e) return vClients(); const c=S.clients.find(x=>x.id===e.client); const p=stepPcts(e);
  const body={overview:engOverview,discovery:engDiscovery,evidence:engEvidence,audit:engAudit,scorecard:engScorecard,opportunities:engOpps,strategy:engStrategy,roadmap:engRoadmap,report:engReport}[route.step]||engOverview;
  return proto()+`<a class="back" href="#client-${c.id}">← ${esc(c.name)}</a>
  <div class="page-hd"><div><h1>${esc(c.name)} · ${e.type}</h1><p class="desc">Started ${e.start} · ${e.fee} · stage: ${e.status}</p></div><div class="row"><span id="saved" class="saved">All changes saved</span><a class="btn primary" href="#eng-${e.id}-${nextStep(e)}">Continue: ${STEPS.find(s=>s[0]===nextStep(e))[1]}</a></div></div>
  <div class="stepper">${STEPS.map(([k,l])=>{const pc=k==="overview"?null:p[k];return `<a class="step ${route.step===k?"active":""} ${pc===100?"done":""}" href="#eng-${e.id}-${k}"><span class="t">${l}</span>${pc==null?"":`<span class="pct"><span class="bar ${pc<40?"red":pc<100?"amber":""}"><i style="width:${pc}%"></i></span>${pc}%</span>`}</a>`;}).join("")}</div>
  ${body(e,c)}`;
}
function nextStep(e){ const p=stepPcts(e); for(const [k] of STEPS){ if(k==="overview") continue; if(p[k]<100) return k; } return "report"; }

function engOverview(e,c){ const ov=overall(e); const next=e.roadmap.filter(r=>r.st!=="Done").slice(0,3);
  return `<div class="grid g2">
    <div class="card"><div class="hd"><h2>Scorecard</h2>${bandBadge(ov)}</div><div class="bd"><div class="row" style="gap:24px;align-items:flex-start"><div><span class="label">Overall</span><div class="score-big ${band(ov)} tab">${ov??"—"}</div></div><div style="flex:1;min-width:200px">${radar(e,180)}</div></div><a class="btn secondary sm" href="#eng-${e.id}-scorecard" style="margin-top:8px">Full scorecard</a></div></div>
    <div class="card"><div class="hd"><h2>Next on the roadmap</h2></div><div class="bd">${next.map(r=>`<div class="att"><div><div class="t">${esc(r.t)}</div><div class="m">Month ${r.m} · ${esc(r.o)} · ${esc(r.ms)}</div></div><span class="badge ${r.st==="In progress"?"blue":""}">${r.st}</span></div>`).join("")}</div></div>
    <div class="card"><div class="hd"><h2>What the audit found</h2></div><div class="bd">${DIMS.slice().sort((a,b)=>(dimScore(e.ratings[a.key])??0)-(dimScore(e.ratings[b.key])??0)).slice(0,3).map(d=>`<div class="att"><div><div class="t">${d.label}</div><div class="m">${esc(e.findings[d.key].w)}</div></div><b class="${band(dimScore(e.ratings[d.key]))==="red"?"muted":""} tab" style="color:var(--${band(dimScore(e.ratings[d.key]))})">${dimScore(e.ratings[d.key])}</b></div>`).join("")}</div></div>
    <div class="card"><div class="hd"><h2>Selected opportunities</h2></div><div class="bd">${e.opps.filter(o=>o.sel).map(o=>`<div class="att"><div><div class="t">${esc(o.t)}</div><div class="m">${dimLabel(o.dim)} · impact ${o.impact} · effort ${o.effort}</div></div></div>`).join("")}</div></div>
  </div>`; }

const DSECS=[["business","Business"],["customers","Customers"],["goals","Goals and measures"],["marketing","Marketing in motion"],["budget","Budget and constraints"]];
function engDiscovery(e){ const sec=e.discovery[S.discSec]||e.discovery.business; const key=e.discovery[S.discSec]?S.discSec:"business";
  const pct=s=>{const v=Object.values(s.a);return Math.round(v.filter(x=>x&&x.trim()).length/v.length*100);};
  return `<div class="dsec"><div class="dnav">${DSECS.map(([k,l])=>`<button class="${key===k?"active":""}" onclick="S.discSec='${k}';render()"><span>${l}</span><span class="p tab">${pct(e.discovery[k])}%</span></button>`).join("")}</div>
  <div class="card"><div class="hd"><h2>${DSECS.find(d=>d[0]===key)[1]}</h2><span class="muted" style="font-size:12px">Autosaves as you type</span></div><div class="bd">
  ${Object.entries(sec.a).map(([q,a],i)=>`<div class="field"><label class="label" for="d-${key}-${i}">${q}</label><textarea id="d-${key}-${i}" oninput="S.engs.e1.discovery['${key}'].a[${JSON.stringify(q).replace(/"/g,"&quot;")}]=this.value;persist()" placeholder="Capture it in the client's words where you can.">${esc(a)}</textarea></div>`).join("")}
  <div class="row sb"><span class="hint">Questions are a template the owner can edit in Settings.</span><button class="btn secondary sm" onclick="toast('Question added to this section')">Add question</button></div>
  </div></div></div>`; }

function engEvidence(e){ const f=S.evFilter||"all"; const list=e.evidence.filter(v=>f==="all"||v.dim===f);
  return `<div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">
  <div class="card" style="grid-column:1/-1"><div class="hd"><h2>Evidence</h2><div class="row"><select style="width:auto" onchange="S.evFilter=this.value;render()"><option value="all" ${f==="all"?"selected":""}>All dimensions</option>${DIMS.map(d=>`<option value="${d.key}" ${f===d.key?"selected":""}>${d.label}</option>`).join("")}</select></div></div><div class="bd">
    ${list.map(v=>`<div class="evitem"><span class="k">${v.kind}</span><div style="flex:1;min-width:0"><div class="t">${esc(v.title)}</div><div class="m">${esc(v.meta)}</div></div><span class="badge">${dimLabel(v.dim)}</span></div>`).join("")||`<div class="empty">No evidence tagged to this dimension yet.</div>`}
  </div></div>
  <div class="card" style="grid-column:1/-1"><div class="hd"><h2>Add evidence</h2></div><div class="bd"><div class="grid g3"><div><label class="label" for="evk">Kind</label><select id="evk"><option>Note</option><option>Link</option><option>File</option><option>Screenshot</option></select></div><div><label class="label" for="evt">Title</label><input id="evt" placeholder="e.g. Competitor pricing page"></div><div><label class="label" for="evd">Dimension</label><select id="evd">${DIMS.map(d=>`<option value="${d.key}">${d.label}</option>`).join("")}</select></div></div><div class="field" style="margin-top:12px"><label class="label" for="evm">What it shows</label><input id="evm" placeholder="One line a reader of the report would understand"></div><button class="btn primary" onclick="addEv()">Add to evidence</button></div></div>
  </div>`; }
function addEv(){ const t=$("#evt").value.trim(); if(!t){toast("Give it a title");return;} S.engs.e1.evidence.unshift({id:"v"+Date.now(),kind:$("#evk").value==="Screenshot"?"Shot":$("#evk").value,title:t,meta:$("#evm").value.trim(),dim:$("#evd").value}); persist(); render(); toast("Evidence added"); }

function engAudit(e){ const d=DIMS.find(x=>x.key===S.audDim)||DIMS[0]; const r=e.ratings[d.key]; const s=dimScore(r); const ev=e.evidence.filter(v=>v.dim===d.key); const f=e.findings[d.key];
  return `<div class="audit">
  <div class="card"><div class="bd" style="padding:8px"><div class="dimlist">${DIMS.map(x=>{const sc=dimScore(e.ratings[x.key]);return `<button class="dim ${x.key===d.key?"active":""}" onclick="S.audDim='${x.key}';render()"><span>${x.label}</span><span class="s tab" style="color:var(--${band(sc)})">${sc??"—"}</span></button>`;}).join("")}</div></div></div>
  <div class="card"><div class="hd"><div><h2>${d.label}</h2><p class="muted" style="font-size:13px;margin-top:2px">${d.q}</p></div><div style="text-align:right"><div class="score-big ${band(s)} tab">${s??"—"}</div>${bandBadge(s)}</div></div><div class="bd">
    ${d.criteria.map(([q,desc],i)=>`<div class="crit"><div><div class="q">${q}</div><div class="d">${desc}</div></div><div><div class="seg" role="radiogroup" aria-label="${q}">${[0,1,2,3,4].map(n=>`<button role="radio" aria-checked="${r[i]===n}" class="${r[i]===n?"on":""}" title="${RATING_LABEL[n]}" onclick="rate('${d.key}',${i},${n})">${n}</button>`).join("")}</div><div class="hint" style="text-align:right">${RATING_LABEL[r[i]]??"Not rated"}</div></div></div>`).join("")}
    <div class="grid g2" style="margin-top:16px"><div><label class="label" for="fs">Strengths</label><textarea id="fs" oninput="S.engs.e1.findings['${d.key}'].s=this.value;persist()">${esc(f.s)}</textarea></div><div><label class="label" for="fw">Weaknesses</label><textarea id="fw" oninput="S.engs.e1.findings['${d.key}'].w=this.value;persist()">${esc(f.w)}</textarea></div></div>
  </div></div>
  <div class="card ev"><div class="hd"><h3>Evidence for this dimension</h3><a href="#eng-e1-evidence" class="muted" style="font-size:12px">Manage</a></div><div class="bd">${ev.map(v=>`<div class="evitem"><span class="k">${v.kind}</span><div><div class="t">${esc(v.title)}</div><div class="m">${esc(v.meta)}</div></div></div>`).join("")||`<div class="empty" style="padding:20px">Nothing tagged yet. Add evidence so the score can be defended.</div>`}</div></div>
  </div>`; }
function rate(k,i,n){ S.engs.e1.ratings[k][i]=n; persist(); render(); }

function radar(e,size){ const n=DIMS.length, cx=size/2, cy=size/2, R=size*0.36; const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n; return [cx+Math.cos(a)*R*v, cy+Math.sin(a)*R*v];};
  const rings=[.25,.5,.75,1].map(v=>`<polygon points="${DIMS.map((_,i)=>pt(i,v).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("");
  const spokes=DIMS.map((_,i)=>{const [x,y]=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;}).join("");
  const vals=DIMS.map(d=>(dimScore(e.ratings[d.key])??0)/100);
  const shape=`<polygon points="${vals.map((v,i)=>pt(i,v).join(",")).join(" ")}" fill="rgba(19,229,44,.18)" stroke="var(--green)" stroke-width="2" stroke-linejoin="round"/>`;
  const dots=vals.map((v,i)=>{const [x,y]=pt(i,v);return `<circle cx="${x}" cy="${y}" r="3" fill="var(--green)"/>`;}).join("");
  const labels=DIMS.map((d,i)=>{const [x,y]=pt(i,1.18);const short=d.label.split(" and ")[0].split(" ")[0];const anchor=x<cx-4?"end":x>cx+4?"start":"middle";return `<text x="${x}" y="${y}" font-size="${size>300?11:9}" fill="var(--muted)" text-anchor="${anchor}" dominant-baseline="middle" font-family="Manrope,sans-serif">${short}</text>`;}).join("");
  return `<svg class="radar" viewBox="0 0 ${size} ${size}" role="img" aria-label="Seven dimension radar">${rings}${spokes}${shape}${dots}${labels}</svg>`; }

function engScorecard(e){ const ov=overall(e); const scored=DIMS.map(d=>({d,s:dimScore(e.ratings[d.key])})).filter(x=>x.s!=null); const hi=scored.slice().sort((a,b)=>b.s-a.s)[0], lo=scored.slice().sort((a,b)=>a.s-b.s)[0];
  return `<div class="grid g2">
  <div class="card"><div class="hd"><h2>Overall</h2>${bandBadge(ov)}</div><div class="bd"><div class="row" style="gap:28px;align-items:center"><div class="score-big ${band(ov)} tab" style="font-size:64px">${ov??"—"}</div><div class="muted" style="max-width:260px">Mean of seven dimension scores. Each dimension is the weighted mean of its criteria, rated 0-4, scaled to 100.</div></div>${radar(e,380)}</div></div>
  <div class="stack"><div class="card"><div class="hd"><h2>By dimension</h2></div><div class="bd"><div class="scorebars">${DIMS.map(d=>{const s=dimScore(e.ratings[d.key]);return `<div class="sbar"><div><div class="l"><b>${d.label}</b><span class="badge ${band(s)}">${bandLabel(s)}</span></div><div class="bar ${band(s)}"><i style="width:${s??0}%"></i></div></div><div class="n tab">${s??"—"}</div></div>`;}).join("")}</div></div></div>
  <div class="grid g2"><div class="card"><div class="hd"><h3>Strongest</h3><span class="badge green">${hi?hi.s:"—"}</span></div><div class="bd"><b class="white">${hi?hi.d.label:""}</b><p class="muted" style="margin-top:4px">${hi?esc(e.findings[hi.d.key].s):""}</p></div></div><div class="card"><div class="hd"><h3>Weakest</h3><span class="badge red">${lo?lo.s:"—"}</span></div><div class="bd"><b class="white">${lo?lo.d.label:""}</b><p class="muted" style="margin-top:4px">${lo?esc(e.findings[lo.d.key].w):""}</p></div></div></div></div>
  </div>`; }

function engOpps(e){ const sel=e.opps.filter(o=>o.sel).length;
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))">
  <div class="card"><div class="hd"><h2>Impact vs effort</h2><span class="muted" style="font-size:12px">Click a dot to select</span></div><div class="bd"><div class="matrix"><span class="q" style="left:0;top:0">Quick wins</span><span class="q" style="right:0;top:0">Big bets</span><span class="q" style="left:0;bottom:0">Fill-ins</span><span class="q" style="right:0;bottom:0">Avoid</span>
  ${e.opps.map((o,i)=>`<button class="dot ${o.sel?"sel":""}" style="left:${(o.effort-0.5)/5*100}%;top:${100-(o.impact-0.5)/5*100}%" title="${esc(o.t)} (impact ${o.impact}, effort ${o.effort})" onclick="toggleOpp('${o.id}')">${i+1}</button>`).join("")}</div><div class="row sb" style="margin-top:8px;font-size:11px;color:var(--muted)"><span>← Low effort</span><span>High effort →</span></div></div></div>
  <div class="card"><div class="hd"><h2>Opportunities</h2><span class="badge green">${sel} selected for strategy</span></div><div class="bd">${e.opps.map((o,i)=>`<div class="opp ${o.sel?"sel":""}"><span class="n tab">${i+1}</span><div><div class="t">${esc(o.t)}</div><div class="d">${esc(o.d)}</div><div class="row" style="margin-top:6px;gap:6px"><span class="badge">${dimLabel(o.dim)}</span><span class="badge">Impact ${o.impact}</span><span class="badge">Effort ${o.effort}</span></div></div><label class="chk"><input type="checkbox" ${o.sel?"checked":""} onchange="toggleOpp('${o.id}')">Select</label></div>`).join("")}
  <div class="row sb" style="margin-top:14px"><span class="hint">Selected opportunities feed the strategy step.</span><button class="btn secondary sm" onclick="toast('Opportunity form opens')">Add opportunity</button></div></div></div></div>`; }
function toggleOpp(id){ const o=S.engs.e1.opps.find(x=>x.id===id); o.sel=!o.sel; persist(); render(); }

function engStrategy(e){ return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))">
  <div class="card" style="grid-column:1/-1"><div class="hd"><h2>Recommendations</h2><div class="row"><button class="btn secondary sm" onclick="toast('Pick from the library: ${S.library.length} reusable recommendations')">Add from library</button><button class="btn secondary sm" onclick="toast('Blank recommendation added')">Write new</button></div></div><div class="bd">
  ${e.recs.map((r,i)=>`<div class="rec"><span class="num tab">${String(i+1).padStart(2,"0")}</span><div><h3>${esc(r.t)}</h3><p>${esc(r.b)}</p><p class="why"><b>Why:</b> ${esc(r.why)} · <b>Addresses:</b> ${r.opps.map(id=>{const o=e.opps.find(x=>x.id===id);return o?esc(o.t):id;}).join(", ")}</p></div><div class="row" style="flex-direction:column;align-items:flex-end;gap:4px"><button class="btn ghost sm" onclick="moveRec(${i},-1)" ${i===0?"disabled":""}>↑</button><button class="btn ghost sm" onclick="moveRec(${i},1)" ${i===e.recs.length-1?"disabled":""}>↓</button></div></div>`).join("")}
  <p class="hint" style="margin-top:12px">Every recommendation carries an assumptions line in the report. The template has no field for guaranteed outcomes.</p></div></div></div>`; }
function moveRec(i,d){ const a=S.engs.e1.recs; const j=i+d; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; persist(); render(); }

function engRoadmap(e){ return `<div class="months">${[1,2,3].map(m=>{const items=e.roadmap.filter(r=>r.m===m);return `<div class="month"><div class="mh"><span>Month ${m}</span><span class="muted tab">${items.filter(r=>r.st==="Done").length}/${items.length} done</span></div><div class="mb">${items.map(r=>`<div class="ritem ${r.st==="Done"?"done":""}"><div class="t">${esc(r.t)}</div><div class="m">Owner: ${esc(r.o)} · Measure: ${esc(r.ms)}</div><div class="f"><span class="st">${["Planned","In progress","Done"].map(s=>`<button class="${r.st===s?"on":""}" onclick="setRm('${r.id}','${s}')">${s}</button>`).join("")}</span></div></div>`).join("")}<button class="btn ghost sm" onclick="toast('Add item to month ${m}')">+ Add item</button></div></div>`;}).join("")}</div>`; }
function setRm(id,s){ S.engs.e1.roadmap.find(r=>r.id===id).st=s; persist(); render(); }

function engReport(e,c){ const ov=overall(e);
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) 300px">
  <div style="min-width:0"><div class="paper">
    <div class="cover"><div class="eyebrow">Strategic Marketing Playbook · Illustrative example</div><h1>${esc(c.name)}</h1><div class="meta">Prepared by Metanite Marketing · November 2026 · Version ${e.reports.length}</div></div>
    <section><h2>Executive summary</h2><p>${esc(c.name)} has a reputation its marketing does not use. Patients describe the practice as gentle and honest, Google rates it 4.9 from 212 reviews, and the budget is set. What is missing is one direction: a written positioning, a page that sells the cosmetic work the business wants to grow, and a way to know which of the $38,000 a year is producing patients.</p><p>Overall marketing score: <b>${ov}</b> (${bandLabel(ov)}). Strongest: Market and customer. Weakest: Measurement and data.</p></section>
    <section><h2>Scorecard</h2><div class="sc"><div><b>Dimension</b></div><div><b>Score</b></div><div><b>Band</b></div>${DIMS.map(d=>{const s=dimScore(e.ratings[d.key]);return `<div>${d.label}</div><div>${s??"—"}</div><div><span class="pill ${band(s)==="green"?"strong":band(s)==="amber"?"dev":"crit"}">${bandLabel(s)}</span></div>`;}).join("")}</div></section>
    <div class="pgbrk" style="color:#999">page break</div>
    ${DIMS.slice(0,2).map(d=>`<section><h2>${d.label} · ${dimScore(e.ratings[d.key])}</h2><p><b>Strengths.</b> ${esc(e.findings[d.key].s)}</p><p><b>Weaknesses.</b> ${esc(e.findings[d.key].w)}</p><p><b>Evidence.</b> ${e.evidence.filter(v=>v.dim===d.key).map(v=>esc(v.title)).join("; ")||"See appendix."}</p></section>`).join("")}
    <p style="color:#888;font-size:12px;margin-top:16px">… five more dimension chapters …</p>
    <section><h2>Recommendations</h2><ol>${e.recs.map(r=>`<li><b>${esc(r.t)}.</b> ${esc(r.b)}</li>`).join("")}</ol><p style="font-size:12px;color:#5c5c78">Assumptions: effects depend on the practice adopting the enquiry standard and approving the cosmetic page within month 2. No outcome is guaranteed.</p></section>
    <section><h2>90-day roadmap</h2>${[1,2,3].map(m=>`<p><b>Month ${m}.</b> ${e.roadmap.filter(r=>r.m===m).map(r=>esc(r.t)).join("; ")}.</p>`).join("")}</section>
    <div class="foot">Metanite Marketing · Strategic marketing leadership for businesses built to last · Confidential, prepared for ${esc(c.name)}</div>
  </div></div>
  <div class="stack"><div class="card"><div class="hd"><h2>Generate</h2></div><div class="bd"><p class="muted" style="margin-bottom:12px">Creates a PDF from the current audit, opportunities, strategy and roadmap, and stores it as a new version.</p><button class="btn primary" style="width:100%" onclick="genReport()">Generate PDF, version ${e.reports.length+1}</button><p class="hint">In the prototype this records a version without producing a file.</p></div></div>
  <div class="card"><div class="hd"><h2>Versions</h2></div><div class="bd versions">${e.reports.slice().reverse().map(r=>`<div class="v"><div><b class="white">Version ${r.v}</b><div class="muted" style="font-size:12px">${r.when} · ${esc(r.by)} · ${esc(r.note)}</div></div><button class="btn ghost sm" onclick="toast('Opens the stored PDF')">Open</button></div>`).join("")}</div></div>
  <div class="card"><div class="hd"><h2>Chapters</h2></div><div class="bd muted" style="font-size:13px;line-height:1.9">Cover · Executive summary · Scorecard · Seven dimension chapters · Opportunities · Recommendations · 90-day roadmap · Evidence appendix · Method and rubric</div></div></div>
  </div>`; }
function genReport(){ const e=S.engs.e1; e.reports.push({v:e.reports.length+1,when:"1 Nov 2026",by:"Manjil Shrestha",note:"Generated from current data"}); persist(); render(); toast("Version "+e.reports.length+" recorded"); }

function vLibrary(){ const f=S.libFilter||"all"; const list=S.library.filter(l=>f==="all"||l.dim===f);
  return proto()+`<div class="page-hd"><div><h1>Recommendation library</h1><p class="desc">Reusable recommendations curated by the owner. Pull them into any strategy, then tailor the wording.</p></div><button class="btn primary" onclick="toast('New library entry form opens')">New entry</button></div>
  <div class="row" style="margin-bottom:14px"><button class="btn ${f==="all"?"primary":"secondary"} sm" onclick="S.libFilter='all';render()">All</button>${DIMS.map(d=>`<button class="btn ${f===d.key?"primary":"secondary"} sm" onclick="S.libFilter='${d.key}';render()">${d.label}</button>`).join("")}</div>
  <div class="card"><div class="bd flush tbl-wrap"><table><thead><tr><th>Recommendation</th><th>Dimension</th><th>Tags</th><th class="right">Used</th></tr></thead><tbody>${list.map((l,i)=>`<tr class="click" onclick="toast('Opens the full recommendation text')"><td class="white">${esc(l.t)}</td><td>${dimLabel(l.dim)}</td><td>${l.tags.map(t=>`<span class="badge">${t}</span>`).join(" ")}</td><td class="right muted tab">${[3,2,4,5,4,2,1,3,2,1][i%10]}×</td></tr>`).join("")}</tbody></table></div></div>`; }

function vSettings(){ const t=S.setTab||"users";
  const tabs=[["users","Users"],["rubric","Audit rubric"],["discovery","Discovery template"],["brand","Brand"],["data","Data"]];
  const body={
    users:`<div class="card"><div class="hd"><h2>Team</h2><button class="btn primary sm" onclick="toast('Invitation email sent')">Invite someone</button></div><div class="bd flush tbl-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>${S.users.map(u=>`<tr><td class="white">${esc(u.n)}</td><td>${esc(u.e)}</td><td><span class="badge ${u.r==="Owner"?"green":""}">${u.r}</span></td><td>${u.pending?`<span class="badge amber">Invited</span>`:`<span class="badge green">Active</span>`}</td></tr>`).join("")}</tbody></table></div></div><p class="hint" style="margin-top:10px">Owner: everything. Consultant: assigned clients only. Viewer: read only. In the local version there is one user, you, with a password.</p>`,
    rubric:`<div class="stack">${DIMS.map(d=>`<div class="card"><div class="hd"><h3>${d.label}</h3><button class="btn ghost sm" onclick="toast('Criterion editor opens')">Edit</button></div><div class="bd">${d.criteria.map(([q,desc])=>`<div class="att"><div><div class="t">${q}</div><div class="m">${desc}</div></div><span class="badge">weight 1</span></div>`).join("")}</div></div>`).join("")}</div>`,
    discovery:`<div class="card"><div class="hd"><h2>Discovery questions</h2><button class="btn secondary sm" onclick="toast('Section added')">Add section</button></div><div class="bd">${DSECS.map(([k,l])=>`<div style="margin-bottom:14px"><span class="label">${l}</span>${Object.keys(S.engs.e1.discovery[k].a).map(q=>`<div class="att"><div class="t">${esc(q)}</div><button class="btn ghost sm" onclick="toast('Question editor opens')">Edit</button></div>`).join("")}</div>`).join("")}</div></div>`,
    brand:`<div class="card"><div class="hd"><h2>Brand</h2></div><div class="bd"><div class="grid g4">${[["Primary","#13e52c"],["Ground","#0f0f22"],["Paper","#f6f5f1"],["Amber","#f5b73b"]].map(([n,h])=>`<div class="tile"><span class="label">${n}</span><div style="height:40px;background:${h};border:1px solid var(--line);border-radius:3px;margin:8px 0"></div><span class="mono">${h}</span></div>`).join("")}</div><p class="hint" style="margin-top:12px">Display: Bricolage Grotesque. Body: Manrope. Corners 3px. Hairline borders, no shadows. One green element per screen.</p></div></div>`,
    data:`<div class="grid g2"><div class="card"><div class="hd"><h2>Export</h2></div><div class="bd"><p class="muted" style="margin-bottom:12px">All clients, engagements and evidence as JSON plus files as a zip.</p><button class="btn secondary" onclick="toast('Export prepared')">Export everything</button></div></div><div class="card"><div class="hd"><h2>Demo data</h2></div><div class="bd"><p class="muted" style="margin-bottom:12px">Rows marked as demo show a badge everywhere. Remove them in one action before real client work.</p><button class="btn danger" onclick="toast('Demo rows would be deleted after confirmation')">Delete all demo rows</button></div></div></div>`
  }[t];
  return proto()+`<div class="page-hd"><div><h1>Settings</h1></div></div><div class="row" style="margin-bottom:16px;border-bottom:1px solid var(--line);gap:0">${tabs.map(([k,l])=>`<button class="btn ghost" style="border-radius:0;border-bottom:2px solid ${t===k?"var(--green)":"transparent"};color:${t===k?"var(--white)":"var(--muted)"}" onclick="S.setTab='${k}';render()">${l}</button>`).join("")}</div>${body}`; }

/* ---------- Palette ---------- */
let palIdx=0;
function palItems(){ const q=$("#palq").value.trim().toLowerCase(); const items=[...NAV.map(([k,l])=>({l,h:"#"+k,g:"Go to"})),...S.clients.map(c=>({l:c.name,h:"#client-"+c.id,g:"Client"})),...S.leads.map(l=>({l:l.biz,h:"#leads",g:"Lead",lead:l.id})),...STEPS.slice(1).map(([k,l])=>({l:"Harbourside · "+l,h:"#eng-e1-"+k,g:"Engagement"}))]; return items.filter(i=>!q||i.l.toLowerCase().includes(q)); }
function openPal(){ $("#palbg").classList.add("open"); $("#palq").value=""; palIdx=0; drawPal(); setTimeout(()=>$("#palq").focus(),0); }
function closePal(){ $("#palbg").classList.remove("open"); }
function drawPal(){ const it=palItems(); $("#pallist").innerHTML=it.map((i,n)=>`<li><button class="${n===palIdx?"on":""}" onmouseenter="palIdx=${n};drawPal()" onclick="goPal(${n})"><span>${esc(i.l)}</span><span>${i.g}</span></button></li>`).join("")||`<li class="muted" style="padding:16px;text-align:center">No matches</li>`; }
function goPal(n){ const i=palItems()[n]; if(!i) return; closePal(); location.hash=i.h; if(i.lead) setTimeout(()=>openLead(i.lead),50); }
$("#openpal").addEventListener("click",openPal);
$("#palbg").addEventListener("click",e=>{ if(e.target===$("#palbg")) closePal(); });
$("#palq").addEventListener("input",()=>{palIdx=0;drawPal();});
$("#palq").addEventListener("keydown",e=>{ const n=palItems().length; if(e.key==="ArrowDown"){e.preventDefault();palIdx=Math.min(n-1,palIdx+1);drawPal();} else if(e.key==="ArrowUp"){e.preventDefault();palIdx=Math.max(0,palIdx-1);drawPal();} else if(e.key==="Enter"){goPal(palIdx);} else if(e.key==="Escape"){closePal();} });
window.addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault(); $("#palbg").classList.contains("open")?closePal():openPal();} if(e.key==="Escape"){closePal();closeDrawer();} });

document.getElementById("logo1").src=LOGO;
render();
</script>
